name: Release Se.Cli

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/init

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build stacks/Tools/src/Se.Cli/Se.Cli.csproj -c Release

      - name: Publish
        run: dotnet publish stacks/Tools/src/Se.Cli/Se.Cli.csproj -c Release -o publish/se-cli

      - name: Create archive
        run: |
          cd publish
          tar -czf se-cli.tar.gz se-cli/
          zip -r se-cli.zip se-cli/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: se-cli-v${{ github.event.inputs.version }}
          name: Se.Cli v${{ github.event.inputs.version }}
          body: |
            ## Se.Cli v${{ github.event.inputs.version }}
            
            Built from commit: ${{ github.sha }}
          files: |
            publish/se-cli.tar.gz
            publish/se-cli.zip
          draft: false
          prerelease: false
