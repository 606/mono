name: Release Se.Cli (Simple)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      branch:
        description: 'Branch to build from (default: feature/init)'
        required: false
        default: 'feature/init'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || 'feature/init' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build Se.Cli
        run: dotnet build stacks/Tools/src/Se.Cli/Se.Cli.csproj -c Release

      - name: Publish Se.Cli
        run: dotnet publish stacks/Tools/src/Se.Cli/Se.Cli.csproj -c Release -o publish/se-cli

      - name: Create release archive
        run: |
          cd publish
          tar -czf se-cli.tar.gz se-cli/
          zip -r se-cli.zip se-cli/

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event.inputs.version }}" != "" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(grep -oP '<Version>\K[^<]+' stacks/Tools/src/Se.Cli/Se.Cli.csproj || echo "1.0.0")
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: se-cli-v${{ steps.get_version.outputs.version }}
          name: Se.Cli v${{ steps.get_version.outputs.version }}
          body: |
            ## Se.Cli v${{ steps.get_version.outputs.version }}
            
            ### Changes
            - Built from commit: ${{ github.sha }}
            - Branch: ${{ github.ref_name }}
            
            ### Downloads
            - [se-cli.tar.gz](https://github.com/${{ github.repository }}/releases/download/se-cli-v${{ steps.get_version.outputs.version }}/se-cli.tar.gz)
            - [se-cli.zip](https://github.com/${{ github.repository }}/releases/download/se-cli-v${{ steps.get_version.outputs.version }}/se-cli.zip)
          files: |
            publish/se-cli.tar.gz
            publish/se-cli.zip
          draft: false
          prerelease: false
